name: Daily Momentum Ranking

on:
  workflow_dispatch:

  schedule:
    - cron: '0 19 * * *'
      timezone: 'Asia/Seoul'

permissions:
  contents: write

jobs:
  run-momentum:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run momentum calculation
        run: |
          python src/momentum.py

      - name: Show generated result
        run: |
          cat data/latest.json

      - name: Commit and push latest result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest.json

          if git diff --cached --quiet; then
            echo "No changes to latest.json"
          else
            git commit -m "Update momentum ranking"
            git push
          fi